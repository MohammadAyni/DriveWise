<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viweport" content="width=device=width, initial-scale=1.0">
    <title>Driving App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <h1>🛻🚗 Driving App</h1>

    <p>Version 1,0</p>
    <div class="card">
        <h2>Welcome Driver🚗🛻</h2>
        <p>Track your driving, earnings, and miles.</p>

        <h3>Today's Driving</h3>

        <input type="number" id="miles" placeholder="Miles driving">

        <input type="number" id="earnings" placeholder="Earning ($)">

        <input type="number" id="fuel" placeholder="Fuel cost ($)">

        <button id="saveDrive">Save Drive</button>
        <p id="result"></p>
        <div id="driverList"></div>

    <div id="totalstats">
          
    <h3>Total Statistics</h3>

    <p id="totalMiles">Total Miles: 0</p>

    <p id="totalEarnings">Total Earnings: $0</p>

    <P id="totalFuel">Total Fuel: $0</P>

    <P id="totalNet">Total Net: $0</P>

    </div>
    <script src="app.js"></script>

    <script>
        if ("serviceWoker" in navigator) {
            nvigator.serviceWoker.register("sw.js");
        }
    </script>
</body>
</html>
